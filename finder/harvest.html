<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harvest — pull &amp; prune</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  header{padding:14px 18px;border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0;display:inline-block} h2{font-size:13px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.6px;margin:26px 0 8px;font-weight:600}
  .sub{color:var(--dim);font-size:12px;margin-top:4px;max-width:640px}
  .bar{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .run{background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:600;
    padding:9px 18px;border-radius:7px;font-size:14px;cursor:pointer}
  .run:hover{filter:brightness(1.08)}
  .run:disabled{background:var(--card);border-color:var(--line);color:var(--dim);cursor:progress}
  .wrap{padding:14px 18px;max-width:900px}
  .when{color:var(--dim);font-size:12px;margin-top:10px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  ul.newlist{list-style:none;margin:0;padding:0}
  ul.newlist li{display:flex;gap:10px;align-items:baseline;padding:7px 4px;border-bottom:1px solid var(--line)}
  .score{font-weight:700;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
  a.ttl{color:var(--fg);text-decoration:none;border-bottom:1px dotted var(--dim);font-weight:600}
  a.ttl:hover{border-bottom-style:solid}
  .co{color:var(--dim)}
  .more{color:var(--dim);font-size:12px;padding:8px 4px}
</style></head><body>
<header>
  <h1>Harvest</h1><a class="back" href="/">← back to cockpit</a>
  <div class="sub">Re-collect the whole justjoin feed. Live offers stay; offers you already applied
    to (bot or by hand) are kept as history; offers that dropped off the feed and were never
    applied to are <b>pruned</b>.</div>
  <div class="bar">
    <button class="run" id="run">↻ Re-harvest now</button>
    <span class="status" id="status"></span>
  </div>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="when" id="when"></div>

  <h2>Recent runs</h2>
  <div id="history"></div>

  <h2>New this run</h2>
  <div id="newlist"></div>
</div>
<script>
const esc=s=>(s||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
const attr=s=>esc(s).replace(/"/g,'&quot;');
const when=s=>(s||'').replace('T',' ').slice(0,16);

function renderStats(last){
  const stats=document.getElementById('stats');
  const w=document.getElementById('when');
  if(!last){
    stats.innerHTML='<div class="empty">No harvest recorded yet. Hit ↻ Re-harvest now to pull the live feed.</div>';
    w.textContent=''; return;
  }
  const tile=(k,v,s,cls='')=>`<div class="tile ${cls}"><div class="k">${k}</div>`
    +`<div class="v">${v}</div><div class="s">${s||''}</div></div>`;
  stats.innerHTML=
     tile('new',      '+'+last.added,  'added this run', last.added?'new':'')
    +tile('removed',  '−'+last.removed,'stale, pruned',  last.removed?'rm':'')
    +tile('in db',    last.total,      'offers stored')
    +tile('live',     last.live,       'on the feed now','hl')
    +tile('history',  last.kept_stale!=null?last.kept_stale:(last.total-last.live), 'stale but applied');
  w.textContent='last run: '+when(last.at);
}

function renderHistory(history){
  const el=document.getElementById('history');
  if(!history||!history.length){ el.innerHTML='<div class="empty">No runs yet.</div>'; return; }
  el.innerHTML=`<table><thead><tr>
      <th>when</th><th class="num">new</th><th class="num">removed</th>
      <th class="num">in db</th><th class="num">live</th></tr></thead><tbody>`
    +history.map(h=>`<tr>
        <td>${esc(when(h.at))}</td>
        <td class="num pos">+${h.added}</td>
        <td class="num neg">−${h.removed}</td>
        <td class="num">${h.total}</td>
        <td class="num">${h.live}</td></tr>`).join('')
    +`</tbody></table>`;
}

function renderNew(offers){
  const el=document.getElementById('newlist');
  if(!offers||!offers.length){ el.innerHTML='<div class="empty">Nothing new in the last run.</div>'; return; }
  const CAP=200, shown=offers.slice(0,CAP);
  el.innerHTML='<ul class="newlist">'+shown.map(o=>`<li>
      <span class="score">${o.score>0?'+':''}${o.score}</span>
      ${o.url?`<a class="ttl" href="${attr(o.url)}" target="_blank">${esc(o.title)}</a>`:`<span class="ttl">${esc(o.title)}</span>`}
      <span class="co">${esc(o.company)}</span>
      <span class="badge">${esc(o.category)}</span>
      <span class="badge">${esc(o.bucket_name)}</span>
    </li>`).join('')+'</ul>'
    +(offers.length>CAP?`<div class="more">…and ${offers.length-CAP} more</div>`:'');
}

async function loadStatus(){
  const r=await fetch('/api/harvest'); const d=await r.json();
  renderStats(d.last);
  renderHistory(d.history);
  renderNew(d.new_offers);
}

document.getElementById('run').addEventListener('click',async()=>{
  if(!confirm('Re-collect every offer from justjoin?\n\n'
            +'Stale offers you never applied to will be REMOVED from the db. '
            +'Offers you already applied to (bot or by hand) are kept as history.')) return;
  const b=document.getElementById('run');
  const st=document.getElementById('status');
  b.disabled=true; b.textContent='↻ harvesting…';
  st.className='status'; st.textContent='fetching the whole feed — this takes a moment…';
  try{
    const r=await fetch('/api/harvest',{method:'POST'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    await loadStatus();
    st.className='status ok'; st.textContent=`✓ done — +${d.added} new, −${d.removed} removed`;
  }catch(err){
    st.className='status err'; st.textContent='✗ harvest failed: '+err.message;
  }finally{
    b.disabled=false; b.textContent='↻ Re-harvest now';
  }
});

loadStatus();
</script>
</body></html>
