<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply cockpit — offers by company</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  header{padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:var(--bg);z-index:5}
  h1{font-size:16px;margin:0 0 3px} .sub{color:var(--dim);font-size:12px}
  .bar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--fg);
    padding:6px 10px;border-radius:6px;min-width:240px;font-size:13px}
  select{background:var(--card);border:1px solid var(--line);color:var(--fg);
    padding:6px 8px;border-radius:6px;font-size:13px}
  .cnt{color:var(--dim);font-size:12px}
  .tool{background:var(--card);border:1px solid var(--line);color:var(--fg);
    padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;
    text-decoration:none;display:inline-block;line-height:1.45}
  .tool:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:disabled{background:var(--card);border-color:var(--line);color:var(--dim);
    cursor:default;font-weight:400}
  .wrap{padding:14px 18px;max-width:1000px}
  .co-group{margin:0 0 18px}
  .co-head{display:flex;gap:9px;align-items:baseline;padding:6px 2px;
    border-bottom:1px solid var(--line);position:sticky;top:96px;background:var(--bg)}
  .co-head.clk{cursor:pointer;user-select:none}
  .co-head.clk:hover .co-name{color:var(--accent)}
  .cocaret{color:var(--dim);font-size:11px;width:11px;display:inline-block;align-self:center}
  .more{font-size:11px;color:var(--accent)}
  .co-name{font-weight:700;font-size:15px}
  .co-count{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:10px;
    padding:0 7px}
  .co-count.big{color:var(--warn);border-color:var(--warn)}
  .co-warn{font-size:11.5px;color:var(--warn);margin-left:auto}
  ul.offers{list-style:none;margin:6px 0 0;padding:0}
  li.of{border:1px solid var(--line);border-left-width:4px;border-radius:7px;
    margin:6px 0;background:var(--card)}
  .lb0{border-left-color:var(--b1)}.lb1{border-left-color:var(--b2)}.lb2{border-left-color:var(--b3)}
  .lb3{border-left-color:var(--b4)}.lb4{border-left-color:var(--b5)}.lb5{border-left-color:var(--b6)}
  .row{display:flex;gap:9px;align-items:baseline;padding:8px 11px;cursor:pointer;flex-wrap:wrap}
  .row input[type=checkbox]{cursor:pointer;margin:0;align-self:center}
  .score{font-weight:700;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
  .ttl{font-weight:600}
  a.ttl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--dim)}
  a.ttl:hover{border-bottom-style:solid}
  .caret{margin-left:auto;color:var(--dim);font-size:12px;user-select:none}
  .pill{font-size:11px;border-radius:10px;padding:0 8px;font-weight:600}
  .pill.bot{background:var(--good);color:#fff}
  .pill.manual{background:var(--warn);color:#111}
  .markbtn{background:var(--card);border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  .markbtn:hover{border-color:var(--warn);color:var(--fg)}
  .markbtn.on{background:var(--warn);border-color:var(--warn);color:#111;font-weight:600}
  .newbadge{font-size:10px;font-weight:700;letter-spacing:.5px;background:#3fae5f;color:#fff;
    border-radius:8px;padding:0 6px;text-transform:uppercase}
  /* category quick-filter chips: a few big categories + a "rest" catch-all */
  .catbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:2px 0 12px}
  .catchip{background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:14px;padding:4px 12px;font-size:12.5px;cursor:pointer;user-select:none;
    white-space:nowrap}
  .catchip:hover{border-color:var(--accent)}
  .catchip .n{color:var(--dim);font-size:11px;margin-left:5px}
  .catchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .catchip.on .n{color:rgba(255,255,255,.8)}
  .catchip.rest{border-style:dashed}
  .bkbar{display:flex;height:24px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:0 0 6px}
  .bkseg{min-width:0}
  .bkseg.s0{background:var(--b1)}.bkseg.s1{background:var(--b2)}.bkseg.s2{background:var(--b3)}
  .bkseg.s3{background:var(--b4)}.bkseg.s4{background:var(--b5)}.bkseg.s5{background:var(--b6)}
  .bklegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-bottom:14px}
  .bklegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .bklegend .s0{background:var(--b1)}.bklegend .s1{background:var(--b2)}.bklegend .s2{background:var(--b3)}
  .bklegend .s3{background:var(--b4)}.bklegend .s4{background:var(--b5)}.bklegend .s5{background:var(--b6)}
  li.of.applied{opacity:.62}
  li.of.applied .ttl{text-decoration:line-through}
  .detail{display:none;padding:2px 13px 12px;border-top:1px solid var(--line);font-size:12.5px}
  li.of.open .detail{display:block}
  .detail dl{display:grid;grid-template-columns:130px 1fr;gap:2px 12px;margin:8px 0}
  .detail dt{color:var(--dim)} .detail dd{margin:0;word-break:break-word}
  .detail .skills{color:var(--dim);margin:8px 0}
  .detail .why{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--dim)}
  .detail .notes{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);
    border-radius:6px;padding:8px 10px;margin-top:6px}
  .detail .freetext{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:6px;padding:8px 10px;margin:4px 0;white-space:pre-wrap}
  .applyprompt{margin-top:10px}
  .applyprompt .head{display:flex;align-items:center;gap:10px;margin-bottom:5px}
  .applyprompt .head .cnt{margin:0}
  .copybtn{background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:600;
    border-radius:6px;padding:3px 12px;font-size:12px;cursor:pointer}
  .copybtn:hover{filter:brightness(1.08)} .copybtn.done{background:var(--good);border-color:var(--good)}
  pre.prompt{background:var(--bg);border:1px solid var(--line);border-radius:6px;
    padding:9px 11px;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:230px;overflow:auto}
  .out-filled_review{color:var(--accent)} .out-submitted{color:#3fae5f}
  .out-blocked{color:#e06a6a}
  /* clickable bucket filter (bar + legend) */
  .bkbar{cursor:pointer}
  .bkseg{transition:opacity .12s} .bkseg.off{opacity:.22}
  .bklegend span{cursor:pointer;user-select:none;padding:1px 7px;border-radius:9px;
    border:1px solid transparent}
  .bklegend span:hover{border-color:var(--line)}
  .bklegend span.on{color:var(--fg);border-color:var(--line)}
  .bklegend span.off{opacity:.45;text-decoration:line-through}
  .ovr{color:var(--warn);font-size:11px}
  /* per-offer score override */
  .scoreedit{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
  .scoreedit .head{margin-bottom:5px}
  .scorerow{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
  .scoreinput{width:66px;background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:6px;padding:6px 8px;font-size:13px;font-variant-numeric:tabular-nums}
  .scorereason{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:6px;padding:6px 9px;font-size:12.5px;font-family:inherit;resize:vertical;min-height:38px}
  .scorebtn{background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:600;
    border-radius:6px;padding:6px 13px;font-size:12px;cursor:pointer;white-space:nowrap}
  .scorebtn:hover{filter:brightness(1.08)} .scorebtn.done{background:var(--good);border-color:var(--good)}
  .scoremeta{font-size:11px;color:var(--warn);margin-top:5px}
</style></head><body>
<header>
  <h1>Apply cockpit</h1>
  <div class="sub">Offers grouped by company. Click a row to expand what happened. A company with
    many openings means: review and pick the best 1–2, don't spray CVs.</div>
  <div class="bar">
    <input type="search" id="q" placeholder="filter title / company / skill…">
    <select id="cat"><option value="">all categories</option></select>
    <select id="cosize" title="Show only companies that have this many offers in the current view.">
      <option value="0">any company size</option>
      <option value="1">1-offer companies</option>
      <option value="2">2-offer companies</option>
      <option value="3">3-offer companies</option>
      <option value="-3">1–3 offers</option>
      <option value="4">4+ offers</option>
    </select>
    <select id="hidemode" title="Hide applied work — by single offer, or whole companies by how many you applied to.">
      <option value="none">show all</option>
      <option value="offers">hide applied offers</option>
      <option value="co1">hide companies I applied to</option>
      <option value="co2">hide companies I applied 2+</option>
    </select>
    <span class="cnt" id="cnt"></span>
    <span style="margin-left:auto"></span>
    <a class="tool" id="harvestlink" href="/harvest" title="Re-collect the live feed and prune stale offers.">↻ Harvest</a>
    <a class="tool" id="historylink" href="/history" title="Every offer applied to and the details of each application.">📋 History</a>
    <button class="tool primary" id="write" disabled>Write worklist (0)</button>
    <button class="tool" id="clearsel">clear</button>
  </div>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="catbar" id="catbar"></div>
  <div class="bkbar" id="bkbar"></div>
  <div class="bklegend" id="bklegend"></div>
  <div id="list"></div>
</div>
<script>
let OFFERS=[];
const SEL=new Set();              // urls picked for the worklist
const COEXP=new Set();            // company names whose group is expanded
const BIG=5;                      // a company with >= this many shown offers gets a warning
const BK=["KILL","VETO","NEG","WEAK","PLAUS","STRONG"];   // bucket index 0..5
const BSEL=new Set([4,5]);        // buckets shown; toggled by clicking the bar / legend chips
const NBIG=8;                     // how many top categories get their own chip; rest collapse
const HImin=4;                    // a "high score" = bucket >= this (PLAUS or STRONG)
let CATSEL='';                    // '' = all | '__rest__' = non-big categories | exact category
let BIGCATS=[];                   // categories with the MOST high-scoring offers (own chips)
let CATCOUNTS={};                 // category -> total offers, over the full dataset
let HICOUNTS={};                  // category -> count of high-scoring offers (drives the chips)

const esc=s=>(s||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
const attr=s=>esc(s).replace(/"/g,'&quot;');
function whyHtml(w){
  return esc(w).replace(/\+[^−]+/g,m=>'<span class="pos">'+m+'</span>')
               .replace(/−.+$/,m=>'<span class="neg">'+m+'</span>');
}

async function load(){
  const r=await fetch('/api/offers'); const d=await r.json();
  OFFERS=d.offers;
  // count categories over the full dataset (stable; the dropdown + chip bar both use these).
  // CATCOUNTS = total offers (dropdown); HICOUNTS = high-scoring offers (drives the chip picks).
  CATCOUNTS={}; HICOUNTS={};
  for(const o of OFFERS){
    CATCOUNTS[o.category]=(CATCOUNTS[o.category]||0)+1;
    if(o.bucket>=HImin) HICOUNTS[o.category]=(HICOUNTS[o.category]||0)+1;
  }
  const cats=Object.keys(CATCOUNTS).sort((a,b)=>CATCOUNTS[b]-CATCOUNTS[a]);  // dropdown: by size
  // chips: the categories richest in high-scoring offers (e.g. python, net, javascript)
  BIGCATS=Object.keys(HICOUNTS).sort((a,b)=>HICOUNTS[b]-HICOUNTS[a]).slice(0,NBIG);
  document.getElementById('cat').insertAdjacentHTML('beforeend',
    cats.map(c=>`<option value="${attr(c)}">${esc(c)} (${CATCOUNTS[c]})</option>`).join(''));
  render();
}

// catScope = search + category (drives the bucket bar — its whole job is the distribution).
// statScope = catScope + the bucket filter (drives the tiles, so changing the selector
// moves the numbers). hide-applied is applied to the LIST only, never to the stats, so
// toggling it never makes the "applied" count vanish.
// CATSEL is the single source of truth for the category filter (chip bar + dropdown both set it).
function catMatch(o){
  if(CATSEL==='') return true;                       // all
  if(CATSEL==='__rest__') return !BIGCATS.includes(o.category);
  return o.category===CATSEL;                         // one exact category
}

function scoped(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  return OFFERS.filter(o=>
    catMatch(o) &&
    (!q || (o.title+' '+o.company+' '+o.skills.join(' ')).toLowerCase().includes(q)));
}

function renderStats(statScope, catScope){
  const applied=statScope.filter(o=>o.applied_by);
  const bot=applied.filter(o=>o.applied_by==='bot');
  const manual=applied.filter(o=>o.applied_by==='manual');
  const blocked=bot.filter(o=>o.application && o.application.outcome==='blocked');
  const companies=new Set(statScope.map(o=>o.company)).size;
  const openGood=statScope.filter(o=>!o.applied_by).length;   // in-filter offers not yet done
  const fresh=statScope.filter(o=>o.is_new).length;           // added in the last Re-harvest
  const tile=(k,v,s,cls='')=>`<div class="tile ${cls}"><div class="k">${k}</div>`
    +`<div class="v">${v}</div><div class="s">${s||''}</div></div>`;
  const bsel=[...BSEL].sort().map(i=>BK[i]).join('/')||'none';
  document.getElementById('stats').innerHTML=
     tile('offers', statScope.length, `${companies} companies · ${bsel}`)
    +tile('new', fresh, 'since last harvest', fresh?'newv':'')
    +tile('applied', applied.length, `${bot.length} bot · ${manual.length} me`, applied.length?'hl':'')
    +tile('blocked', blocked.length, blocked.length?'needs manual':'—', blocked.length?'warnv':'')
    +tile('still open', openGood, 'not applied yet', openGood?'hl':'');

  // bucket distribution bar over the FULL category scope — shows the whole makeup regardless
  // of which buckets are selected, so you can see how much of a category is STRONG vs junk.
  // Both the bar and the legend are the bucket FILTER: click a segment/chip to toggle it.
  const bc=[0,0,0,0,0,0]; for(const o of catScope) bc[o.bucket]++;
  const tot=catScope.length||1;
  document.getElementById('bkbar').innerHTML=bc.map((n,i)=>
    n?`<div class="bkseg s${i}${BSEL.has(i)?'':' off'}" data-b="${i}" style="flex:${n}" title="${BK[i]}: ${n} — click to toggle"></div>`:'').join('');
  document.getElementById('bklegend').innerHTML=
    `<span class="hint" style="cursor:default;opacity:.7">click to filter →</span>`
    +bc.map((n,i)=>
    `<span class="${BSEL.has(i)?'on':'off'}" data-b="${i}"><i class="s${i}"></i>${BK[i]} ${n} · ${Math.round(100*n/tot)}%</span>`).join('');
}

// The category chip bar: [all] + the NBIG categories richest in high-scoring offers + a "rest"
// catch-all. The chip number is the count of HIGH-scoring (STRONG/PLAUS) offers — that's the
// whole point of the picks; total offers is on hover. Counts are full-dataset, so stable.
function renderCatbar(){
  const allHi=OFFERS.reduce((n,o)=>n+(o.bucket>=HImin?1:0),0);
  const restHi=OFFERS.reduce((n,o)=>n+((o.bucket>=HImin && !BIGCATS.includes(o.category))?1:0),0);
  const restTot=OFFERS.reduce((n,o)=>n+(BIGCATS.includes(o.category)?0:1),0);
  const chip=(sel,label,hi,tot)=>{
    const on=CATSEL===sel;
    const rest=sel==='__rest__'?' rest':'';
    return `<span class="catchip${on?' on':''}${rest}" data-cat="${attr(sel)}"`
      +` title="${hi} high-scoring (STRONG/PLAUS) of ${tot} total">`
      +`${esc(label)}<span class="n">${hi}</span></span>`;
  };
  const parts=[chip('','all',allHi,OFFERS.length)];
  for(const c of BIGCATS) parts.push(chip(c, c, HICOUNTS[c]||0, CATCOUNTS[c]));
  if(restTot) parts.push(chip('__rest__','rest', restHi, restTot));
  document.getElementById('catbar').innerHTML=parts.join('');
  // keep the dropdown in step: it can name any exact category, but not "rest" — show blank then.
  document.getElementById('cat').value=(CATSEL==='__rest__')?'':CATSEL;
}

function groupByCompany(rows){
  const g={};
  for(const o of rows){ (g[o.company]=g[o.company]||[]).push(o); }
  const groups=Object.entries(g).map(([company,offers])=>{
    offers.sort((a,b)=>b.score-a.score);
    return {company, offers, best:offers[0].score};
  });
  // best company first; within a tie, the one with more offers (more to triage) first
  groups.sort((a,b)=> b.best-a.best || b.offers.length-a.offers.length);
  return groups;
}

function offerLi(o){
  const applied=!!o.applied_by;
  const meta=[o.level,o.workplace,o.cities.join(', '),o.salary,o.stack]
    .filter(Boolean).map(x=>`<span class="badge">${esc(x)}</span>`).join(' ');
  let pill='';
  if(o.applied_by==='bot'){
    const oc=o.application?o.application.outcome:'';
    pill=`<span class="pill bot">bot · ${esc(oc)}</span>`;
  }else if(o.applied_by==='manual'){
    pill=`<span class="pill manual">applied by me</span>`;
  }
  const checkbox=applied?'' :
    `<input type="checkbox" class="pick" data-u="${attr(o.url)}" ${SEL.has(o.url)?'checked':''}>`;
  const isManual=o.applied_by==='manual';
  const mark=`<button class="markbtn${isManual?' on':''}" data-u="${attr(o.url)}">${isManual?'✓ applied by me':'I applied by hand'}</button>`;
  const title=o.url?`<a class="ttl" href="${attr(o.url)}" target="_blank" onclick="event.stopPropagation()">${esc(o.title)}</a>`
                   :`<span class="ttl">${esc(o.title)}</span>`;
  const newb=o.is_new?'<span class="newbadge">new</span>':'';
  return `<li class="of lb${o.bucket}${applied?' applied':''}" data-u="${attr(o.url)}">
    <div class="row">
      ${checkbox}
      <span class="score">${o.score>0?'+':''}${o.score}</span>${o.score_override?'<span class="ovr" title="manual score">✎</span>':''}
      ${title} ${newb} ${meta} ${pill} ${mark}
      <span class="caret">▸</span>
    </div>
    <div class="detail">${detailHtml(o)}</div>
  </li>`;
}

// The paste-into-Cowork prompt for ONE offer. Mirrors orchestrator_instructions.md §3's
// subagent task, minus the queue wrapper: read the two files, run mode review, this offer.
function applyPrompt(o){
  const offer={url:o.url, title:o.title, company:o.company,
               location:(o.cities||[]).join(', '), stack:o.stack};
  if(o.apply_method) offer.apply_method=o.apply_method;
  if(o.apply_url)    offer.apply_url=o.apply_url;
  return `You are the Applier. Apply to ONE job offer for Yan Lukashevich by driving his logged-in `
    +`Chrome via the claude-in-chrome tools.\n\n`
    +`Read and follow these two files in this folder, exactly:\n`
    +`  - applier_instructions.md  (behavior, rules, the loop, logging)\n`
    +`  - profile.md               (the sole source of truth for facts)\n\n`
    +`Run mode: review   (fill everything, then STOP before the final Submit)\n\n`
    +`The one offer to handle:\n${JSON.stringify(offer, null, 2)}\n\n`
    +`Follow the playbook end to end, including appending your outcome to `
    +`applications_log.jsonl (and todo_manual.md if blocked). Then report back with the exact `
    +`JSON object you logged.`;
}

function detailHtml(o){
  let h=`<div class="skills">${esc(o.skills.join(' · '))||'—'}</div>`;
  h+=`<div class="why">${whyHtml(o.why)}</div>`;
  const a=o.application;
  if(a){
    const answers=(a.composed_answers||[]).filter(Boolean);
    h+=`<dl>
      <dt>applied</dt><dd class="out-${esc(a.outcome)}">${esc(a.outcome)} · ${esc(a.apply_type||'')}</dd>
      <dt>when</dt><dd>${esc((a.timestamp||'').replace('T',' ').slice(0,19))}</dd>
      <dt>CV used</dt><dd>${esc(a.cv_used||'—')}</dd>
      ${a.blocked_reason?`<dt>blocked</dt><dd class="neg">${esc(a.blocked_reason)}</dd>`:''}
    </dl>`;
    if(answers.length){
      h+=`<div class="cnt">free-text entered:</div>`;
      h+=answers.map(t=>`<div class="freetext">${esc(typeof t==='string'?t:JSON.stringify(t))}</div>`).join('');
    }
    if(a.notes) h+=`<div class="notes">${esc(a.notes)}</div>`;
  }else if(o.manual_at){
    h+=`<dl><dt>applied by me</dt><dd>${esc(o.manual_at.replace('T',' ').slice(0,19))}</dd></dl>`;
  }else{
    h+=`<div class="cnt" style="margin-top:6px">not applied yet</div>`;
  }
  h+=`<div class="scoreedit">
    <div class="head cnt">Adjust score &amp; reason (overrides the auto score for sorting and display):</div>
    <div class="scorerow">
      <input type="number" class="scoreinput" data-u="${attr(o.url)}" value="${o.score}" step="1">
      <textarea class="scorereason" data-u="${attr(o.url)}" placeholder="why this score? (your note)">${esc(o.score_reason||'')}</textarea>
      <button class="scorebtn" data-u="${attr(o.url)}">Save</button>
    </div>
    ${o.score_override?`<div class="scoremeta">manual override · auto score was ${o.base_score>0?'+':''}${o.base_score}</div>`:''}
  </div>`;
  h+=`<div class="applyprompt">
    <div class="head">
      <div class="cnt">Cowork prompt — paste into a fresh Cowork agent to apply to this one offer:</div>
      <button class="copybtn" data-u="${attr(o.url)}">Copy prompt</button>
    </div>
    <pre class="prompt">${esc(applyPrompt(o))}</pre>
  </div>`;
  return h;
}

// company-size filter: does a company with n offers (in scope) match the selector?
function sizeMatch(n, v){
  if(v==='0') return true;          // any size
  if(v==='4') return n>=4;          // 4 or more
  if(v==='-3') return n>=1 && n<=3; // 1 through 3
  return n===+v;                    // exactly 1 / 2 / 3
}

// how many offers of a company were applied to (bot or by hand)
function appliedCount(offers){ return offers.filter(o=>o.applied_by).length; }

// hide mode: none = show all; offers = drop applied offers within each company;
// co1/co2 = drop the WHOLE company once you've applied to >=1 / >=2 of its offers.
function applyHide(groups, mode){
  if(mode==='offers')
    return groups.map(g=>({...g, offers:g.offers.filter(o=>!o.applied_by)}))
                 .filter(g=>g.offers.length);
  if(mode==='co1') return groups.filter(g=>appliedCount(g.offers)<1);
  if(mode==='co2') return groups.filter(g=>appliedCount(g.offers)<2);
  return groups;
}

function render(){
  renderCatbar();
  const catScope=scoped();
  const hideMode=document.getElementById('hidemode').value;
  const cosize=document.getElementById('cosize').value;
  const statScope=catScope.filter(o=>BSEL.has(o.bucket));
  renderStats(statScope, catScope);
  // group FIRST so company-level decisions (size, applied count) see the whole company,
  // then filter groups by size, then apply the hide mode.
  let groups=groupByCompany(statScope);
  groups=groups.filter(g=>sizeMatch(g.offers.length, cosize));
  groups=applyHide(groups, hideMode);
  const rows=groups.reduce((n,g)=>n+g.offers.length,0);
  document.getElementById('cnt').textContent=
    `showing ${rows} · ${groups.length} companies`;
  const list=document.getElementById('list');
  if(!rows){ list.innerHTML='<div class="empty">No offers match.</div>'; return; }
  list.innerHTML=groups.map(g=>{
    const big=g.offers.length>=BIG;
    const collapsible=g.offers.length>2;                    // 1–2 offers show in full
    const expanded=COEXP.has(g.company);
    const shown=(collapsible && !expanded) ? g.offers.slice(0,2) : g.offers;
    const hidden=g.offers.length-shown.length;
    return `<div class="co-group">
      <div class="co-head${collapsible?' clk':''}" data-co="${attr(g.company)}">
        <span class="cocaret">${collapsible?(expanded?'▾':'▸'):''}</span>
        <span class="co-name">${esc(g.company)}</span>
        <span class="co-count${big?' big':''}">${g.offers.length} offer${g.offers.length>1?'s':''}</span>
        ${big?`<span class="co-warn">many openings — pick the best 1–2</span>`:''}
        ${(collapsible&&!expanded)?`<span class="more">+${hidden} more ▾</span>`:''}
      </div>
      <ul class="offers">${shown.map(offerLi).join('')}</ul>
    </div>`;
  }).join('');
  updateWriteBtn();
}

function updateWriteBtn(){
  const b=document.getElementById('write');
  b.textContent=`Write worklist (${SEL.size})`;
  b.disabled=SEL.size===0;
}

// ---- events (delegated; the list is rebuilt on every render) ----
document.getElementById('q').addEventListener('input',render);
document.getElementById('cat').addEventListener('change',e=>{ CATSEL=e.target.value; render(); });
document.getElementById('catbar').addEventListener('click',e=>{
  const c=e.target.closest('.catchip'); if(!c) return;
  CATSEL=c.dataset.cat; render();
});
document.getElementById('cosize').addEventListener('change',render);
document.getElementById('hidemode').addEventListener('change',render);

// bucket filter: clicking a bar segment or a legend chip toggles that bucket in/out of view
function toggleBucket(i){ BSEL.has(i)?BSEL.delete(i):BSEL.add(i); render(); }
document.getElementById('bkbar').addEventListener('click',e=>{
  const s=e.target.closest('.bkseg'); if(s&&s.dataset.b!=null) toggleBucket(+s.dataset.b); });
document.getElementById('bklegend').addEventListener('click',e=>{
  const s=e.target.closest('span[data-b]'); if(s) toggleBucket(+s.dataset.b); });

document.getElementById('list').addEventListener('click',async e=>{
  const pick=e.target.closest('.pick');
  if(pick){ e.stopPropagation();
    if(pick.checked) SEL.add(pick.dataset.u); else SEL.delete(pick.dataset.u);
    updateWriteBtn(); return; }
  const mark=e.target.closest('.markbtn');
  if(mark){ e.stopPropagation();
    const r=await fetch('/api/manual',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({url:mark.dataset.u})});
    const d=await r.json();
    const o=OFFERS.find(x=>x.url===d.url);
    if(o){ o.manual_at=d.manual_at;
      o.applied_by = o.application ? 'bot' : (d.manual_at ? 'manual' : null);
      if(o.applied_by) SEL.delete(o.url); }
    render(); return; }
  const sbtn=e.target.closest('.scorebtn');
  if(sbtn){ e.stopPropagation();
    const box=sbtn.closest('.scoreedit');
    const score=parseInt(box.querySelector('.scoreinput').value,10);
    if(Number.isNaN(score)){ alert('Score must be a whole number'); return; }
    const reason=box.querySelector('.scorereason').value;
    const url=sbtn.dataset.u;
    const r=await fetch('/api/score',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({url, score, reason})});
    const d=await r.json();
    const o=OFFERS.find(x=>x.url===url);
    // base_score already holds the auto score from /api/offers — never overwrite it here.
    if(o){ o.score=d.score; o.score_reason=d.reason; o.score_override=true; o.score_at=d.at; }
    sbtn.textContent='✓ Saved'; sbtn.classList.add('done');
    // re-sort/relabel with the new score after a beat so the "✓ Saved" flash is visible
    setTimeout(render,650);
    return; }
  const copy=e.target.closest('.copybtn');
  if(copy){ e.stopPropagation();
    const o=OFFERS.find(x=>x.url===copy.dataset.u);
    if(o){
      try{
        await navigator.clipboard.writeText(applyPrompt(o));
        const label=copy.textContent; copy.textContent='✓ Copied'; copy.classList.add('done');
        setTimeout(()=>{copy.textContent=label; copy.classList.remove('done');},1800);
      }catch(err){ alert('Copy failed: '+err.message); }
    }
    return; }
  const coh=e.target.closest('.co-head.clk');
  if(coh){ const c=coh.dataset.co; COEXP.has(c)?COEXP.delete(c):COEXP.add(c); render(); return; }
  // clicks inside the prompt block or the score editor (typing/selecting) must not collapse the detail
  if(e.target.closest('.applyprompt') || e.target.closest('.scoreedit')) return;
  // otherwise: toggle the detail panel
  const li=e.target.closest('li.of');
  if(li && !e.target.closest('a')) li.classList.toggle('open');
});

document.getElementById('write').addEventListener('click',async()=>{
  const urls=[...SEL];
  const r=await fetch('/api/worklist',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({urls})});
  const d=await r.json();
  const b=document.getElementById('write');
  b.textContent=`✓ wrote ${d.written} → src/worklist.json`;
  setTimeout(updateWriteBtn,2500);
});

document.getElementById('clearsel').addEventListener('click',()=>{
  SEL.clear(); render();
});

load();
</script>
</body></html>
