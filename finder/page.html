<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply cockpit — offers by company</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/offer.css">
<style>
  header{padding:14px 18px;border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0 0 3px} .sub{color:var(--dim);font-size:12px}
  .bar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--fg);
    padding:6px 10px;border-radius:6px;min-width:240px;font-size:13px}
  select{background:var(--card);border:1px solid var(--line);color:var(--fg);
    padding:6px 8px;border-radius:6px;font-size:13px}
  /* Two columns: the offer list, and a panel that stays put while you scroll it past.
     Same shape as the history page's detail column. */
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;
    align-items:start;padding:14px 18px;max-width:1440px}
  .main{min-width:0}
  /* The filter header scrolls away; only the nav bar stays, so the panel hangs just under it.
     The gutter is reserved and the rows stop short of it: Chrome's scrollbar fattens on
     hover, and it was landing on top of the row's own x button. */
  #side{position:sticky;top:calc(var(--nav-h) + 14px);
    max-height:calc(100vh - var(--nav-h) - 28px);overflow:auto;
    scrollbar-gutter:stable;
    border-left:1px solid var(--line);padding-left:16px;padding-right:10px;min-width:0}
  /* Below ~1100px the list column gets too narrow to read; drop the panel underneath. */
  @media (max-width:1100px){
    .wrap{grid-template-columns:minmax(0,1fr)}
    #side{position:static;border-left:0;border-top:1px solid var(--line);
      padding:12px 0 0;max-height:none}
  }
  .sidetabs{display:flex;gap:6px;margin-bottom:10px}
  .sidetab{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
  .sidetab:hover{border-color:var(--accent)}
  .sidetab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .qrow{display:flex;gap:7px;align-items:baseline;padding:5px 0;
    border-bottom:1px solid var(--line);font-size:12px}
  .qrow .qsc{font-weight:700;font-variant-numeric:tabular-nums;min-width:24px;text-align:right}
  /* Drag starts here and nowhere else -- the row's own text is a link, which needs the
     pointer for its own job. */
  .qrow .qgrip{cursor:grab;color:var(--dim);opacity:.3;font-size:13px;line-height:1;
    padding:0 1px;user-select:none;flex:0 0 auto}
  .qrow:hover .qgrip{opacity:.85}
  .qrow.drag{opacity:.35}
  /* The whole text block is the link to the offer -- the row is the target, not an icon. */
  .qrow .qtx{flex:1;min-width:0;display:block;color:inherit;text-decoration:none}
  .qrow a.qtx:hover .qti{color:var(--accent)}
  .qrow .qti{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .qrow .qco{color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  /* Same 🔎 the offer row's pick button uses for "queued AND on the dig list". */
  .qrow .qdig{flex:0 0 auto;font-size:10.5px;line-height:1;opacity:.8}
  .qrow .qx{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;
    line-height:1;padding:0 2px}
  .qrow .qx:hover{color:var(--bad)}
  /* Past the nightly cap: queued, but not running tonight. */
  .qrow.later{opacity:.5}
  .qrow .stg,.qrow .found{flex:0 0 auto;align-self:center}
  .qerr{color:var(--bad);font-size:12px;padding:10px 0;overflow-wrap:anywhere}
  .qempty{color:var(--dim);font-size:12px;padding:14px 0}
  .qdiv{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;
    margin:9px 0 2px;border-top:1px dashed var(--line);padding-top:6px}
  .qdiv.first{border-top:0;margin-top:0;padding-top:0}
  .sidefoot{font-size:11px;color:var(--dim);margin-top:12px;
    border-top:1px solid var(--line);padding-top:9px}
  /* A command is a block you can read and select, not an inline blob broken mid-flag. */
  .sidefoot code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
    background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;
    color:var(--fg);display:block;white-space:pre-wrap;line-height:1.5}
  .sidefoot .cmd{margin-top:8px}
  .sidefoot .cmdnote{display:block;margin-top:2px;font-size:10.5px;opacity:.85}
  .sidefoot .lb{color:var(--fg);display:block;margin-top:7px}
  .sidefoot button{margin-top:8px}
  /* the group itself is styled in offer.css; here it hangs under the nav bar */
  .co-head{position:sticky;top:var(--nav-h)}
  /* category quick-filter chips: a few big categories + a "rest" catch-all */
  .catbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:2px 0 12px}
  .catchip{background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:14px;padding:4px 12px;font-size:12.5px;cursor:pointer;user-select:none;
    white-space:nowrap}
  .catchip:hover{border-color:var(--accent)}
  .catchip .n{color:var(--dim);font-size:11px;margin-left:5px}
  .catchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .catchip.on .n{color:rgba(255,255,255,.8)}
  .catchip.rest{border-style:dashed}
  .bkbar{display:flex;height:24px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:0 0 6px}
  .bkseg{min-width:0}
  .bkseg.s0{background:var(--b1)}.bkseg.s1{background:var(--b2)}.bkseg.s2{background:var(--b3)}
  .bkseg.s3{background:var(--b4)}.bkseg.s4{background:var(--b5)}.bkseg.s5{background:var(--b6)}
  .bklegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-bottom:14px}
  .bklegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .bklegend .s0{background:var(--b1)}.bklegend .s1{background:var(--b2)}.bklegend .s2{background:var(--b3)}
  .bklegend .s3{background:var(--b4)}.bklegend .s4{background:var(--b5)}.bklegend .s5{background:var(--b6)}
  /* clickable bucket filter (bar + legend) */
  .bkbar{cursor:pointer}
  .bkseg{transition:opacity .12s} .bkseg.off{opacity:.22}
  .bklegend span{cursor:pointer;user-select:none;padding:1px 7px;border-radius:9px;
    border:1px solid transparent}
  .bklegend span:hover{border-color:var(--line)}
  .bklegend span.on{color:var(--fg);border-color:var(--line)}
  .bklegend span.off{opacity:.45;text-decoration:line-through}
</style>
<script src="/static/offer.js"></script></head><body>
<header>
  <h1>Apply cockpit</h1>
  <div class="sub">Offers grouped by company. Click a row to expand what happened. A company with
    many openings means: review and pick the best 1–2, don't spray CVs. The pick button queues
    an offer straight away — the queue is on the right and the runner drains it at 23:00.</div>
  <div class="bar">
    <input type="search" id="q" placeholder="filter title / company / skill…">
    <select id="cat"><option value="">all categories</option></select>
    <select id="cosize" title="Show only companies that have this many offers in the current view.">
      <option value="0">any company size</option>
      <option value="1">1-offer companies</option>
      <option value="2">2-offer companies</option>
      <option value="3">3-offer companies</option>
      <option value="-3">1–3 offers</option>
      <option value="4">4+ offers</option>
    </select>
    <select id="hidemode" title="Hide applied work — by single offer, or whole companies by how many you applied to.">
      <option value="none">show all</option>
      <option value="offers">hide applied offers</option>
      <option value="co1">hide companies I applied to</option>
      <option value="co2">hide companies I applied 2+</option>
    </select>
    <select id="expired" title="Expired = the offer dropped off every feed that carried it. It stays in the db as history.">
      <option value="hide">hide expired</option>
      <option value="show">+ expired</option>
      <option value="only">only expired</option>
    </select>
    <span class="cnt" id="cnt"></span>
  </div>
</header>
<div class="wrap">
  <div class="main">
    <div class="stats" id="stats"></div>
    <div class="catbar" id="catbar"></div>
    <div class="bkbar" id="bkbar"></div>
    <div class="bklegend" id="bklegend"></div>
    <div id="list"></div>
  </div>
  <div id="side">
    <div class="sidetabs">
      <button class="sidetab on" id="tab-queue" data-t="queue">Queue (0)</button>
      <button class="sidetab" id="tab-dig" data-t="dig">Dig deeper (0)</button>
    </div>
    <div id="sidebody"></div>
  </div>
</div>
<script>
let OFFERS=[];                    // every offer, live and expired
let POOL=[];                      // OFFERS minus what the expired selector hides
let QUEUE={items:[],count:0,cap:10,last_batch:null};   // runner/data/worklist.json, as served
let DIG={items:[],count:0};       // finder/data/dig_deeper.json, as served
let SIDETAB='queue';              // which panel tab is showing
const COEXP=new Set();            // company names whose group is expanded
const BIG=5;                      // a company with >= this many shown offers gets a warning
const BK=["KILL","VETO","NEG","WEAK","PLAUS","STRONG"];   // bucket index 0..5
const BSEL=new Set([4,5]);        // buckets shown; toggled by clicking the bar / legend chips
const NBIG=8;                     // how many top categories get their own chip; rest collapse
const HImin=4;                    // a "high score" = bucket >= this (PLAUS or STRONG)
let CATSEL='';                    // '' = all | '__rest__' = non-big categories | exact category
let BIGCATS=[];                   // categories with the MOST high-scoring offers (own chips)
let CATCOUNTS={};                 // category -> total offers, over the full dataset
let HICOUNTS={};                  // category -> count of high-scoring offers (drives the chips)

async function load(){
  const r=await fetch('/api/offers'); const d=await r.json();
  OFFERS=d.offers;
  rebuildCats();
  render();
  loadSide();
}

// Category counts are computed over POOL = everything the expired selector lets through, so
// they stay stable while you filter by search/category but still drop when you hide expired.
function rebuildCats(){
  POOL=OFFERS.filter(expMatch);
  // CATCOUNTS = total offers (dropdown); HICOUNTS = high-scoring offers (drives the chip picks).
  CATCOUNTS={}; HICOUNTS={};
  for(const o of POOL){
    CATCOUNTS[o.category]=(CATCOUNTS[o.category]||0)+1;
    if(o.bucket>=HImin) HICOUNTS[o.category]=(HICOUNTS[o.category]||0)+1;
  }
  const cats=Object.keys(CATCOUNTS).sort((a,b)=>CATCOUNTS[b]-CATCOUNTS[a]);  // dropdown: by size
  // chips: the categories richest in high-scoring offers (e.g. python, net, javascript)
  BIGCATS=Object.keys(HICOUNTS).sort((a,b)=>HICOUNTS[b]-HICOUNTS[a]).slice(0,NBIG);
  document.getElementById('cat').innerHTML='<option value="">all categories</option>'
    +cats.map(c=>`<option value="${attr(c)}">${esc(c)} (${CATCOUNTS[c]})</option>`).join('');
}

// catScope = search + category (drives the bucket bar — its whole job is the distribution).
// statScope = catScope + the bucket filter (drives the tiles, so changing the selector
// moves the numbers). hide-applied is applied to the LIST only, never to the stats, so
// toggling it never makes the "applied" count vanish.
// CATSEL is the single source of truth for the category filter (chip bar + dropdown both set it).
function catMatch(o){
  if(CATSEL==='') return true;                       // all
  if(CATSEL==='__rest__') return !BIGCATS.includes(o.category);
  return o.category===CATSEL;                         // one exact category
}

// expired = archived by a harvest (gone from the live feed). Filtered here, alongside search
// and category, so every count on the page describes the same set of offers you can see.
function expMatch(o){
  const m=document.getElementById('expired').value;
  if(m==='only') return o.archived;
  if(m==='hide') return !o.archived;
  return true;
}

function scoped(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  return OFFERS.filter(o=>
    catMatch(o) && expMatch(o) &&
    (!q || (o.title+' '+o.company+' '+o.skills.join(' ')).toLowerCase().includes(q)));
}

function renderStats(statScope, catScope){
  const applied=statScope.filter(o=>o.applied_by);
  const bot=applied.filter(o=>o.applied_by==='bot');
  const manual=applied.filter(o=>o.applied_by==='manual');
  const blocked=bot.filter(o=>o.application && o.application.outcome==='blocked');
  const companies=new Set(statScope.map(o=>o.company)).size;
  const openGood=statScope.filter(o=>!o.applied_by).length;   // in-filter offers not yet done
  const fresh=statScope.filter(o=>o.is_new).length;           // added in the last Re-harvest
  const tile=(k,v,s,cls='')=>`<div class="tile ${cls}"><div class="k">${k}</div>`
    +`<div class="v">${v}</div><div class="s">${s||''}</div></div>`;
  const bsel=[...BSEL].sort().map(i=>BK[i]).join('/')||'none';
  // the expired tile counts the WHOLE db, not the scope — its job is to say how much history
  // the selector is currently holding back.
  const expMode=document.getElementById('expired').value;
  const expTot=OFFERS.reduce((n,o)=>n+(o.archived?1:0),0);
  document.getElementById('stats').innerHTML=
     tile('offers', statScope.length, `${companies} companies · ${bsel}`)
    +tile('new', fresh, 'since last harvest', fresh?'newv':'')
    +tile('applied', applied.length, `${bot.length} bot · ${manual.length} me`, applied.length?'hl':'')
    +tile('blocked', blocked.length, blocked.length?'needs manual':'—', blocked.length?'warnv':'')
    +tile('still open', openGood, 'not applied yet', openGood?'hl':'')
    +(expTot?tile('expired', expTot, expMode==='hide'?'hidden':'in view'):'');

  // bucket distribution bar over the FULL category scope — shows the whole makeup regardless
  // of which buckets are selected, so you can see how much of a category is STRONG vs junk.
  // Both the bar and the legend are the bucket FILTER: click a segment/chip to toggle it.
  const bc=[0,0,0,0,0,0]; for(const o of catScope) bc[o.bucket]++;
  const tot=catScope.length||1;
  document.getElementById('bkbar').innerHTML=bc.map((n,i)=>
    n?`<div class="bkseg s${i}${BSEL.has(i)?'':' off'}" data-b="${i}" style="flex:${n}" title="${BK[i]}: ${n} — click to toggle"></div>`:'').join('');
  document.getElementById('bklegend').innerHTML=
    `<span class="hint" style="cursor:default;opacity:.7">click to filter →</span>`
    +bc.map((n,i)=>
    `<span class="${BSEL.has(i)?'on':'off'}" data-b="${i}"><i class="s${i}"></i>${BK[i]} ${n} · ${Math.round(100*n/tot)}%</span>`).join('');
}

// The category chip bar: [all] + the NBIG categories richest in high-scoring offers + a "rest"
// catch-all. The chip number is the count of HIGH-scoring (STRONG/PLAUS) offers — that's the
// whole point of the picks; total offers is on hover. Counts are full-dataset, so stable.
function renderCatbar(){
  const allHi=POOL.reduce((n,o)=>n+(o.bucket>=HImin?1:0),0);
  const restHi=POOL.reduce((n,o)=>n+((o.bucket>=HImin && !BIGCATS.includes(o.category))?1:0),0);
  const restTot=POOL.reduce((n,o)=>n+(BIGCATS.includes(o.category)?0:1),0);
  const chip=(sel,label,hi,tot)=>{
    const on=CATSEL===sel;
    const rest=sel==='__rest__'?' rest':'';
    return `<span class="catchip${on?' on':''}${rest}" data-cat="${attr(sel)}"`
      +` title="${hi} high-scoring (STRONG/PLAUS) of ${tot} total">`
      +`${esc(label)}<span class="n">${hi}</span></span>`;
  };
  const parts=[chip('','all',allHi,POOL.length)];
  for(const c of BIGCATS) parts.push(chip(c, c, HICOUNTS[c]||0, CATCOUNTS[c]));
  if(restTot) parts.push(chip('__rest__','rest', restHi, restTot));
  document.getElementById('catbar').innerHTML=parts.join('');
  // keep the dropdown in step: it can name any exact category, but not "rest" — show blank then.
  document.getElementById('cat').value=(CATSEL==='__rest__')?'':CATSEL;
}

function groupByCompany(rows){
  const g={};
  for(const o of rows){ (g[o.company]=g[o.company]||[]).push(o); }
  const groups=Object.entries(g).map(([company,offers])=>{
    offers.sort((a,b)=>b.score-a.score);
    return {company, offers, best:offers[0].score};
  });
  // best company first; within a tie, the one with more offers (more to triage) first
  groups.sort((a,b)=> b.best-a.best || b.offers.length-a.offers.length);
  return groups;
}

// company-size filter: does a company with n offers (in scope) match the selector?
function sizeMatch(n, v){
  if(v==='0') return true;          // any size
  if(v==='4') return n>=4;          // 4 or more
  if(v==='-3') return n>=1 && n<=3; // 1 through 3
  return n===+v;                    // exactly 1 / 2 / 3
}

// how many offers of a company were applied to (bot or by hand)
function appliedCount(offers){ return offers.filter(o=>o.applied_by).length; }

// hide mode: none = show all; offers = drop applied offers within each company;
// co1/co2 = drop the WHOLE company once you've applied to >=1 / >=2 of its offers.
function applyHide(groups, mode){
  if(mode==='offers')
    return groups.map(g=>({...g, offers:g.offers.filter(o=>!o.applied_by)}))
                 .filter(g=>g.offers.length);
  if(mode==='co1') return groups.filter(g=>appliedCount(g.offers)<1);
  if(mode==='co2') return groups.filter(g=>appliedCount(g.offers)<2);
  return groups;
}

function render(){
  renderCatbar();
  const catScope=scoped();
  const hideMode=document.getElementById('hidemode').value;
  const cosize=document.getElementById('cosize').value;
  const statScope=catScope.filter(o=>BSEL.has(o.bucket));
  renderStats(statScope, catScope);
  // group FIRST so company-level decisions (size, applied count) see the whole company,
  // then filter groups by size, then apply the hide mode.
  let groups=groupByCompany(statScope);
  groups=groups.filter(g=>sizeMatch(g.offers.length, cosize));
  groups=applyHide(groups, hideMode);
  const rows=groups.reduce((n,g)=>n+g.offers.length,0);
  document.getElementById('cnt').textContent=
    `showing ${rows} · ${groups.length} companies`;
  const list=document.getElementById('list');
  if(!rows){ list.innerHTML='<div class="empty">No offers match.</div>'; return; }
  list.innerHTML=groups.map(g=>{
    const big=g.offers.length>=BIG;
    const collapsible=g.offers.length>2;                    // 1–2 offers show in full
    const expanded=COEXP.has(g.company);
    const shown=(collapsible && !expanded) ? g.offers.slice(0,2) : g.offers;
    const hidden=g.offers.length-shown.length;
    return `<div class="co-group">
      <div class="co-head${collapsible?' clk':''}" data-co="${attr(g.company)}">
        <span class="cocaret">${collapsible?(expanded?'▾':'▸'):''}</span>
        <span class="co-name">${esc(g.company)}</span>
        <span class="co-count${big?' big':''}">${g.offers.length} offer${g.offers.length>1?'s':''}</span>
        ${big?`<span class="co-warn">many openings — pick the best 1–2</span>`:''}
        ${(collapsible&&!expanded)?`<span class="more">+${hidden} more ▾</span>`:''}
      </div>
      <ul class="offers">${shown.map(o=>offerLi(o)).join('')}</ul>
    </div>`;
  }).join('');
}

// ---- the right-hand panel: the apply queue and the dig-deeper list ----
// Both are files on the server, so the panel always re-fetches rather than mirroring the
// page's offer objects — the nightly runner deletes from the queue while this tab is open.

async function loadSide(){
  const [q,d]=await Promise.all([fetch('/api/queue').then(r=>r.json()),
                                 fetch('/api/dig').then(r=>r.json())]);
  QUEUE=q; DIG=d;
  renderSide();
}

// The row reads title-first because that is what you are picking between, and the whole text
// block is the link: you open an offer by clicking the row, not a small arrow beside it.
const qtitle=(c,t,u)=>{
  const body=`<span class="qti">${esc(t||'')}</span><span class="qco">${esc(c||'')}</span>`;
  return u?`<a class="qtx" href="${attr(u)}" target="_blank" rel="noopener"`
          +` title="${attr(t||'')} — open the offer">${body}</a>`
         :`<span class="qtx" title="${attr(t||'')}">${body}</span>`;
};
const qscore=n=>`<span class="qsc">${n==null?'':(n>0?'+':'')+n}</span>`;
const QGRIP=`<span class="qgrip" title="drag to reorder">⠿</span>`;

function renderQueue(){
  const cap=QUEUE.cap||10;
  // Both lists are already in hand, so the queue row can say which of its offers you also
  // meant to chase by hand -- the two lists are filed under the same canonical offer url.
  const dug=new Set(DIG.items.map(d=>d.url));
  if(!QUEUE.items.length)
    return `<div class="qempty">Queue is empty — click an offer's ☐ to queue it.</div>`
      +queueFoot();
  // Queue order IS run order, so the divider answers the only question the list raises:
  // which of these actually run tonight, and which wait for tomorrow.
  const over=QUEUE.items.length>cap;
  return QUEUE.items.map((e,i)=>{
    let div='';
    if(over && i===0)   div=`<div class="qdiv first">tonight's ${cap}</div>`;
    if(over && i===cap) div=`<div class="qdiv">waiting for the next night</div>`;
    return div+`<div class="qrow${i>=cap?' later':''}" draggable="true" data-u="${attr(e.url)}">
      ${QGRIP}${qscore(e.score)}${qtitle(e.company,e.title,e.url)}
      ${dug.has(e.url)?`<span class="qdig" title="also on the dig-deeper list">🔎</span>`:''}
      <button class="qx" data-q="${attr(e.url)}" title="drop from the queue">×</button>
    </div>`;
  }).join('')+queueFoot();
}

function queueFoot(){
  const b=QUEUE.last_batch;
  const cap=QUEUE.cap||10;
  let last='<span class="lb">last batch: never run</span>';
  if(b){
    const bits=[`${b.attempted||0} attempted`];
    if(b.applied!=null) bits.push(`${b.applied} applied`);
    if(b.blocked)       bits.push(`${b.blocked} blocked`);
    if(b.cost_usd)      bits.push('$'+(+b.cost_usd).toFixed(2));
    last=`<span class="lb">last batch: ${esc((b.finished||b.started||'').replace('T',' ').slice(0,16))}`
      +` · ${esc(bits.join(' · '))}`
      +`${b.aborted?` · <span class="neg">stopped: ${esc(b.aborted)}</span>`:''}</span>`;
  }
  return `<div class="sidefoot">
    <div>nightly 23:00 · the top ${cap} run, in this order — drag ⠿ to change it · an offer
      leaves the queue once it is logged</div>
    <div class="cmd"><code>python runner\\run_batch.py --mode auto --limit ${cap}</code>
      <span class="cmdnote">what the nightly task runs: fills and submits</span></div>
    <div class="cmd"><code>python runner\\run_batch.py --mode review --limit ${cap}</code>
      <span class="cmdnote">fills everything, stops before the final Submit</span></div>
    ${last}
  </div>`;
}

// Each row opens its card on /outreach, where the contacts and the email are edited -- the
// panel only says how far along each one is.
function renderDig(){
  if(DIG.error) return `<div class="qerr">${esc(DIG.error)}</div>`;
  if(!DIG.items.length)
    return `<div class="qempty">Nothing here yet — click a queued offer's ✓ to add it.</div>`;
  return DIG.items.map(d=>`<div class="qrow" data-u="${attr(d.url)}">
      ${qscore(d.score)}<a class="qtx" href="/outreach#${attr(encodeURIComponent(d.url))}"
        title="${attr(d.title||'')} — open its card"><span class="qti">${esc(d.title||'')}</span>`
        +`<span class="qco">${esc(d.company||'')}</span></a>
      ${stageChip(d)}
      <button class="qx" data-d="${attr(d.url)}" data-c="${attr(d.company||'')}"
        title="drop from the dig list">×</button>
    </div>`).join('')
    +`<div class="sidefoot">Still queued for the bot as well — this is the list you work by
      hand, top down: furthest along first (approved, drafts, contacts, nothing yet), queue
      order within each. A row opens its card on <a href="/outreach">/outreach</a>, where
      ✉ Send mails the approved ones; a sent email takes the card off this list.
      <button class="tool" id="digcopy">Copy as markdown</button></div>`;
}

function renderSide(){
  document.getElementById('tab-queue').textContent=`Queue (${QUEUE.count})`;
  document.getElementById('tab-dig').textContent=`Dig deeper (${DIG.count})`;
  for(const t of document.querySelectorAll('.sidetab'))
    t.classList.toggle('on', t.dataset.t===SIDETAB);
  document.getElementById('sidebody').innerHTML=
    SIDETAB==='queue'?renderQueue():renderDig();
}

// ---- dragging a panel row ----
// Queue order is run order -- for the bot, and for the dig list within each stage -- so
// the drag has to end in a file write, not a DOM tweak. The row
// is moved live while you drag; on drop the new order is POSTed and the panel is redrawn from
// what came back -- which is also what puts the "tonight's N" divider back in the right place.
let DRAGROW=null;

function panelRows(){ return [...document.querySelectorAll('#sidebody .qrow')]; }

document.getElementById('sidebody').addEventListener('mousedown',e=>{
  // Only the grip starts a drag: the row's text is a link and the note is a textarea.
  const row=e.target.closest('.qrow');
  if(row) row.draggable=!!e.target.closest('.qgrip');
});

document.getElementById('sidebody').addEventListener('dragstart',e=>{
  const row=e.target.closest('.qrow'); if(!row||!row.draggable){ e.preventDefault(); return; }
  DRAGROW=row; row.classList.add('drag');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain','');   // Firefox drags nothing without a payload
});

document.getElementById('sidebody').addEventListener('dragover',e=>{
  if(!DRAGROW) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  const over=e.target.closest('.qrow');
  if(!over||over===DRAGROW) return;
  const r=over.getBoundingClientRect();
  const after=e.clientY > r.top + r.height/2;
  over.parentNode.insertBefore(DRAGROW, after?over.nextSibling:over);
});

document.getElementById('sidebody').addEventListener('drop',e=>{ if(DRAGROW) e.preventDefault(); });

document.getElementById('sidebody').addEventListener('dragend',async ()=>{
  const row=DRAGROW; if(!row) return;
  DRAGROW=null; row.classList.remove('drag'); row.draggable=false;
  const urls=panelRows().map(r=>r.dataset.u);
  const r=await fetch('/api/queue/reorder',{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({urls})});
  QUEUE=await r.json();
  DIG=await fetch('/api/dig').then(x=>x.json());   // queue order within a stage: re-sorted by this
  renderSide();
});

// A panel action changes the same two files the rows read their state from, so both are
// redrawn: the offer list to un-tick its button, the panel to drop the row.
async function sideRefresh(){
  const r=await fetch('/api/offers'); OFFERS=(await r.json()).offers;
  render(); await loadSide();
}

// ---- events (delegated; the list is rebuilt on every render) ----
document.getElementById('q').addEventListener('input',render);
document.getElementById('cat').addEventListener('change',e=>{ CATSEL=e.target.value; render(); });
document.getElementById('catbar').addEventListener('click',e=>{
  const c=e.target.closest('.catchip'); if(!c) return;
  CATSEL=c.dataset.cat; render();
});
document.getElementById('cosize').addEventListener('change',render);
document.getElementById('hidemode').addEventListener('change',render);
// changing the expired mode changes the pool the category counts are drawn from
document.getElementById('expired').addEventListener('change',()=>{ rebuildCats(); render(); });

// bucket filter: clicking a bar segment or a legend chip toggles that bucket in/out of view
function toggleBucket(i){ BSEL.has(i)?BSEL.delete(i):BSEL.add(i); render(); }
document.getElementById('bkbar').addEventListener('click',e=>{
  const s=e.target.closest('.bkseg'); if(s&&s.dataset.b!=null) toggleBucket(+s.dataset.b); });
document.getElementById('bklegend').addEventListener('click',e=>{
  const s=e.target.closest('span[data-b]'); if(s) toggleBucket(+s.dataset.b); });

// company headers are this page's own; the offer rows themselves are wired by offer.js, which
// ignores clicks that land outside one.
document.getElementById('list').addEventListener('click',e=>{
  const coh=e.target.closest('.co-head.clk');
  if(coh){ const c=coh.dataset.co; COEXP.has(c)?COEXP.delete(c):COEXP.add(c); render(); }
});
wireOfferList(document.getElementById('list'), {
  find:u=>OFFERS.find(x=>x.url===u),
  refresh:render,
  onPick:loadSide,
});

// ---- panel events ----
document.getElementById('side').addEventListener('click',async e=>{
  const tab=e.target.closest('.sidetab');
  if(tab){ SIDETAB=tab.dataset.t; renderSide(); return; }
  const post=(path,u)=>fetch(path,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({url:u})});
  const x=e.target.closest('.qx');
  if(x){
    // The two lists are dropped separately: unqueueing an offer must not throw away the
    // contact you spent ten minutes digging up, and vice versa.
    if(x.dataset.q!=null) await post('/api/queue/remove', x.dataset.q);
    else if(!await dropDig(x.dataset.d, x.dataset.c)) return;
    await sideRefresh(); return;
  }
  if(e.target.id==='digcopy'){ await copyFlash(e.target, digMarkdown(DIG.items)); return; }
});

// An agent filling cards in dig_deeper.json, or the sender removing what it mailed, changes
// the panel while this tab sits in the background -- catch up when you come back to it.
window.addEventListener('focus', loadSide);

load();
</script>
</body></html>
