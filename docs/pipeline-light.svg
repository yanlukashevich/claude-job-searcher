<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a94a6"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="898" height="438" rx="18" fill="#ffffff" stroke="#e1e4e8"/>

  <!-- phase labels -->
  <text x="34" y="44" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#4285F4">1 · FINDER</text>
  <text x="118" y="44" font-size="12.5" fill="#8a94a6">deterministic Python — no LLM</text>

  <text x="34" y="250" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#8b5cf6">2 · APPLIER</text>
  <text x="128" y="250" font-size="12.5" fill="#8a94a6">Claude agents in a real browser</text>

  <!-- ROW 1 arrows -->
  <line x1="212" y1="107" x2="246" y2="107" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="432" y1="107" x2="466" y2="107" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="652" y1="107" x2="686" y2="107" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- connector Worklist -> Orchestrator -->
  <path d="M780,152 L780,205 L120,205 L120,266" fill="none" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/>

  <!-- ROW 2 arrows -->
  <line x1="212" y1="313" x2="246" y2="313" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="472" y1="313" x2="516" y2="313" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== ROW 1 ===== -->
  <!-- Harvest -->
  <rect x="30" y="64" width="180" height="86" rx="12" fill="#e8f0fe" stroke="#4285F4"/>
  <text x="120" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3d7c">Harvest</text>
  <text x="120" y="122" text-anchor="middle" font-size="11.5" fill="#5b6b8c">job-board JSON APIs</text>

  <!-- Score -->
  <rect x="252" y="64" width="180" height="86" rx="12" fill="#e8f0fe" stroke="#4285F4"/>
  <text x="342" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3d7c">Score</text>
  <text x="342" y="122" text-anchor="middle" font-size="11.5" fill="#5b6b8c">deterministic classifier</text>

  <!-- Human cockpit -->
  <rect x="474" y="64" width="180" height="86" rx="12" fill="#fef3e2" stroke="#f5a623"/>
  <text x="564" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4d00">Human cockpit</text>
  <text x="564" y="122" text-anchor="middle" font-size="11.5" fill="#8a6a2a">review · visualize · pick</text>

  <!-- Worklist -->
  <rect x="696" y="64" width="168" height="86" rx="12" fill="#e8f0fe" stroke="#4285F4"/>
  <text x="780" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3d7c">Worklist</text>
  <text x="780" y="122" text-anchor="middle" font-size="11.5" fill="#5b6b8c">the picked batch</text>

  <!-- ===== ROW 2 ===== -->
  <!-- Orchestrator -->
  <rect x="30" y="270" width="180" height="86" rx="12" fill="#f0e9fb" stroke="#8b5cf6"/>
  <text x="120" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#4c2a85">Orchestrator</text>
  <text x="120" y="328" text-anchor="middle" font-size="11.5" fill="#6f5aa0">one subagent per offer</text>

  <!-- Per-offer applier subagents -->
  <rect x="252" y="270" width="220" height="86" rx="12" fill="#f0e9fb" stroke="#8b5cf6"/>
  <text x="362" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#4c2a85">Applier subagents</text>
  <text x="362" y="328" text-anchor="middle" font-size="11.5" fill="#6f5aa0">drive a real Chrome</text>

  <!-- Audit log -->
  <rect x="518" y="270" width="180" height="86" rx="12" fill="#e6f4ea" stroke="#34A853"/>
  <text x="608" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#1e5631">Audit log</text>
  <text x="608" y="328" text-anchor="middle" font-size="11.5" fill="#3c7a52">append-only · verbatim</text>

  <!-- legend -->
  <circle cx="40" cy="404" r="5" fill="#4285F4"/>
  <text x="52" y="408" font-size="12" fill="#57606a">Deterministic code</text>
  <circle cx="200" cy="404" r="5" fill="#f5a623"/>
  <text x="212" y="408" font-size="12" fill="#57606a">Human-in-the-loop</text>
  <circle cx="360" cy="404" r="5" fill="#8b5cf6"/>
  <text x="372" y="408" font-size="12" fill="#57606a">Claude agents</text>
  <circle cx="500" cy="404" r="5" fill="#34A853"/>
  <text x="512" y="408" font-size="12" fill="#57606a">Audit trail</text>
</svg>
