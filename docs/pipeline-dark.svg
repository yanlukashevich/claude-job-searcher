<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="898" height="438" rx="18" fill="#0d1117" stroke="#30363d"/>

  <!-- phase labels -->
  <text x="34" y="44" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#6ea8ff">1 · FINDER</text>
  <text x="118" y="44" font-size="12.5" fill="#8b949e">deterministic Python — no LLM</text>

  <text x="34" y="250" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#b494ff">2 · APPLIER</text>
  <text x="128" y="250" font-size="12.5" fill="#8b949e">Claude agents in a real browser</text>

  <!-- ROW 1 arrows -->
  <line x1="212" y1="107" x2="246" y2="107" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="432" y1="107" x2="466" y2="107" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="652" y1="107" x2="686" y2="107" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- connector Worklist -> Orchestrator -->
  <path d="M780,152 L780,205 L120,205 L120,266" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ROW 2 arrows -->
  <line x1="212" y1="313" x2="246" y2="313" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="472" y1="313" x2="516" y2="313" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== ROW 1 ===== -->
  <!-- Harvest -->
  <rect x="30" y="64" width="180" height="86" rx="12" fill="#16233f" stroke="#4c8bf5"/>
  <text x="120" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#cdd9f5">Harvest</text>
  <text x="120" y="122" text-anchor="middle" font-size="11.5" fill="#8fa3c9">job-board JSON APIs</text>

  <!-- Score -->
  <rect x="252" y="64" width="180" height="86" rx="12" fill="#16233f" stroke="#4c8bf5"/>
  <text x="342" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#cdd9f5">Score</text>
  <text x="342" y="122" text-anchor="middle" font-size="11.5" fill="#8fa3c9">deterministic classifier</text>

  <!-- Human cockpit -->
  <rect x="474" y="64" width="180" height="86" rx="12" fill="#3a2e12" stroke="#f0b429"/>
  <text x="564" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#f5e2b8">Human cockpit</text>
  <text x="564" y="122" text-anchor="middle" font-size="11.5" fill="#d8bd7e">review · visualize · pick</text>

  <!-- Worklist -->
  <rect x="696" y="64" width="168" height="86" rx="12" fill="#16233f" stroke="#4c8bf5"/>
  <text x="780" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#cdd9f5">Worklist</text>
  <text x="780" y="122" text-anchor="middle" font-size="11.5" fill="#8fa3c9">the picked batch</text>

  <!-- ===== ROW 2 ===== -->
  <!-- Orchestrator -->
  <rect x="30" y="270" width="180" height="86" rx="12" fill="#241a42" stroke="#a78bfa"/>
  <text x="120" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#ddd0fb">Orchestrator</text>
  <text x="120" y="328" text-anchor="middle" font-size="11.5" fill="#b3a2dd">one subagent per offer</text>

  <!-- Per-offer applier subagents -->
  <rect x="252" y="270" width="220" height="86" rx="12" fill="#241a42" stroke="#a78bfa"/>
  <text x="362" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#ddd0fb">Applier subagents</text>
  <text x="362" y="328" text-anchor="middle" font-size="11.5" fill="#b3a2dd">drive a real Chrome</text>

  <!-- Audit log -->
  <rect x="518" y="270" width="180" height="86" rx="12" fill="#12331f" stroke="#46c46a"/>
  <text x="608" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#c3e8cd">Audit log</text>
  <text x="608" y="328" text-anchor="middle" font-size="11.5" fill="#8fc9a3">append-only · verbatim</text>

  <!-- legend -->
  <circle cx="40" cy="404" r="5" fill="#4c8bf5"/>
  <text x="52" y="408" font-size="12" fill="#8b949e">Deterministic code</text>
  <circle cx="200" cy="404" r="5" fill="#f0b429"/>
  <text x="212" y="408" font-size="12" fill="#8b949e">Human-in-the-loop</text>
  <circle cx="360" cy="404" r="5" fill="#a78bfa"/>
  <text x="372" y="408" font-size="12" fill="#8b949e">Claude agents</text>
  <circle cx="500" cy="404" r="5" fill="#46c46a"/>
  <text x="512" y="408" font-size="12" fill="#8b949e">Audit trail</text>
</svg>
